<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabin · 车机兼容性检测</title><link rel="stylesheet" href="/style.css"><script type="module" src="/probe.js"></script></head>
<body><header class="topbar"><a class="brand" href="/">cabin<span class="brand-cn">兼容性检测</span></a><span class="version">停车测试 · 无需账号</span></header><main>
<section class="intro"><div><p class="eyebrow">BEFORE WE CONNECT</p><h1>先确认这个浏览器，<br><span>能不能接收画面。</span></h1></div><div class="intro-aside"><span id="probe-status" role="status">等待检测</span><p>仅生成原创测试画面，不读取屏幕、麦克风、车辆或音乐账号。</p></div></section>
<section class="card"><div class="section-heading"><span class="step">01</span><h2>本机浏览器检测</h2></div><p class="muted">两个 WebRTC 端点在当前页面内传输视频。成功只证明该浏览器能处理这条视频链路，不能证明手机热点、跨设备连接或行驶状态可用。</p><div class="button-row"><button class="button primary" id="run-probe">开始 8 秒检测</button><button class="button secondary" id="stop-probe">停止</button><button class="button ghost" id="copy-report">复制检测结果</button></div></section>
<div class="workspace" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:22px"><section class="viewer-card"><div class="viewer-toolbar"><strong>本机回环接收画面</strong><span>实际解码</span></div><div class="screen"><video id="probe-video" autoplay muted playsinline controls></video></div><div class="viewer-footer"><span id="probe-codec">尚未开始</span><span id="probe-frames">0 帧</span></div></section><section class="card"><div class="section-heading"><span class="step">02</span><h2>检测结果</h2></div><pre id="probe-report" style="font:12px/1.8 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#536648">尚未检测</pre></section></div><canvas id="probe-canvas" width="640" height="360" hidden></canvas><footer class="page-footer">结果只留在当前页面；点击复制后可自行发回。不记录车辆身份或精确位置。</footer>
</main></body></html>
